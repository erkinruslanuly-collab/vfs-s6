<body>
    <h1>Менің алғашқы бұлттық қолданбам</h1>
    <p>Қолданба зертханалық жұмыс аясында жасалды.</p>
    <h3>Бұлттық есептеулердің артықшылықтары:</h3>
<ul>
    <li>Масштабталу (Resources scalability)</li>
    <li>Қолжетімділік және сенімділік (High availability)</li>
    <li>Инфрақұрылымға кеткен шығындарды үнемдеу (Cost efficiency)</li>
</ul>
